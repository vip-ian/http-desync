worker_processes 1;
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    log_format lab escape=json '{"time":"$time_iso8601","connection":"$connection",'
        '"connection_requests":"$connection_requests","request":"$request",'
        '"status":"$status","upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status"}';
    access_log /dev/stdout lab;

    upstream captured_backend {
        server relay:9000;
        keepalive 8;
    }

    server {
        listen 8080;
        server_name _;
        keepalive_timeout 15s;
        client_header_timeout 5s;
        client_body_timeout 5s;

        location / {
            proxy_pass http://captured_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 3s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
        }
    }
}
